<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="docGrad" x1="8" y1="4" x2="38" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="foldGrad" x1="26" y1="4" x2="38" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="23" y1="25" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
  </defs>

  <!-- Document Outline (Transparent Background, Vector Paper) -->
  <path
    d="M10 4H26L38 16V24"
    stroke="url(#docGrad)"
    stroke-width="4.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M10 4C6.8 4 4.5 6.3 4.5 9.5V38.5C4.5 41.7 6.8 44 10 44H21"
    stroke="url(#docGrad)"
    stroke-width="4.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Top-Right Fold Flap (Filled 3D Paper Fold) -->
  <path
    d="M26 4V16H38L26 4Z"
    fill="url(#foldGrad)"
    stroke="url(#docGrad)"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- 4 Document Text Lines (Pill Bars) -->
  <rect x="11.5" y="17.5" width="13" height="3" rx="1.5" fill="#3B82F6" opacity="0.9" />
  <rect x="11.5" y="23.5" width="18" height="3" rx="1.5" fill="#3B82F6" opacity="0.9" />
  <rect x="11.5" y="29.5" width="12" height="3" rx="1.5" fill="#3B82F6" opacity="0.9" />
  <rect x="11.5" y="35.5" width="8" height="3" rx="1.5" fill="#3B82F6" opacity="0.9" />

  <!-- Magnifying Glass Lens Glow & Highlight -->
  <circle
    cx="31.5"
    cy="31.5"
    r="8.5"
    fill="#EFF6FF"
    fill-opacity="0.85"
  />

  <!-- Magnifying Glass Rim -->
  <circle
    cx="31.5"
    cy="31.5"
    r="8.5"
    stroke="url(#glassGrad)"
    stroke-width="4.6"
  />

  <!-- Lens Gloss Highlight -->
  <path
    d="M26 29A5.5 5.5 0 0 1 31 25.5"
    stroke="#93C5FD"
    stroke-width="2.2"
    stroke-linecap="round"
  />

  <!-- Magnifying Glass Handle -->
  <path
    d="M37.5 37.5L44.5 44.5"
    stroke="url(#glassGrad)"
    stroke-width="5.8"
    stroke-linecap="round"
  />
</svg>